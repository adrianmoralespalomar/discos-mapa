[package]
name = "discos-mapa"
version = "0.1.0"
description = "Mapa visual de los discos con ayuda para decidir qué se puede borrar"
authors = ["Adrián Morales"]
license = "MIT"
repository = "https://github.com/adrianmoralespalomar/discos-mapa"
edition = "2024"
rust-version = "1.90"

[lib]
name = "discos_mapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
